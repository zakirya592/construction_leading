<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Tamayuz — Trading &amp; Contracting</title>
  <meta name="description" content="Trading, contracting, and industrial support services.">
  <meta name="theme-color" content="#100f0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <div class="progress" id="progress"></div>

  <div class="loader" id="loader" role="status" aria-live="polite" aria-busy="true">
    <div class="loader-mark" aria-hidden="true">
      <span class="loader-ring"></span>
      <span class="loader-ring loader-ring-inner"></span>
    </div>
    <p class="loader-label">Loading</p>

  <header class="site-header" id="header"></header>

  <main id="main"></main>

  <footer class="site-footer" id="footer" hidden></footer>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <script src="js/main.js?v=7"></script>
  <script src="js/landing.js?v=7"></script>

</html>
